<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#17233A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bidstra — AI bid intelligence for civil engineering</title>
    <script type="module" crossorigin src="./assets/index-DIG_BTVK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BxBVUTR2.css">
  </head>
  <body>
    <div id="root"></div>
  <script>
    /* Add a "Log in" link into the nav next to "Get started" (built site is compiled React;
       inject into the real DOM after mount so layout + style match). Added by assembly-jon. */
    (function(){
      function add(){
        if(document.getElementById('bidstra-login')) return true;
        var gs=[].slice.call(document.querySelectorAll('a')).filter(function(a){return /get started/i.test((a.textContent||''));})[0];
        if(!gs) return false;
        var login=document.createElement('a');
        login.id='bidstra-login';
        login.href='https://app.merkatai.com/?product=bidstra';
        login.textContent='Log in';
        login.style.cssText='font:500 0.875rem/1 Inter,system-ui,sans-serif;color:#fff;opacity:.85;text-decoration:none;white-space:nowrap;transition:opacity .15s;';
        login.onmouseenter=function(){this.style.opacity='1';};
        login.onmouseleave=function(){this.style.opacity='.85';};
        var wrap=document.createElement('div');
        wrap.style.cssText='display:flex;align-items:center;gap:1.25rem;';
        gs.parentNode.insertBefore(wrap,gs); wrap.appendChild(login); wrap.appendChild(gs);
        return true;
      }
      var n=0,iv=setInterval(function(){n++; if(add()||n>60) clearInterval(iv);},100);
    })();
  </script>
  </body>
</html>
